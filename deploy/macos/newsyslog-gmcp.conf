# /etc/newsyslog.d/gmcp.conf: rotate at 10 MB, keep 5, bzip2.
# The server holds its log open, so after rotating it gets SIGTERM (15) and
# launchd's KeepAlive restarts it onto the fresh file within ~10 s.
# logfilename                       [owner:group]  mode count size  when  flags  [/pid_file]                  [sig_num]
/Users/gmcp/logs/server.log         gmcp:staff     600  5     10240 *     J      /Users/gmcp/run/server.pid   15
/Users/gmcp/logs/server.err.log     gmcp:staff     600  5     10240 *     J      /Users/gmcp/run/server.pid   15
/Users/gmcp/logs/token-check.log    gmcp:staff     600  5     1024  *     JN
